[build-system]
requires = ["hatchling>=1.27", "hatch-nodejs-version>=0.3.2", "jupyter-builder>=1.2.0,<2"]
build-backend = "hatchling.build"

[project]
name = "jupyterlab-jstex"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "jupyter_server>=2.13.0,<3",
    "anywidget>=0.11,<0.12",
    "pystac>=1.15,<2",
    "pystac-client>=0.9,<0.10",
    "requests>=2.31",
    "shapely>=2.0",
    "traitlets>=5.9",
    "tomli>=2; python_version < '3.11'",
]
dynamic = ["version", "description", "authors", "urls", "keywords"]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4",
    "jupyter-builder>=1.2.0",
    "jupyterlab-translate>=1.3.7",
]
test = [
    "coverage",
    "jsonschema>=4.20",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-jupyter[server]>=0.6.0",
    "responses>=0.25",
    "ruff>=0.6",
]

# Translations shipped in jstex/locale/<ll_CC>/LC_MESSAGES/jstex.json (JupyterLab standard).
[project.entry-points."jupyterlab.locale"]
jstex = "jstex"

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls", "keywords"]

[tool.hatch.build.targets.sdist]
artifacts = ["jstex/labextension", "jstex/static"]
exclude = [".github", "binder"]

[tool.hatch.build.targets.wheel]
# Distribution "jupyterlab-jstex", import package "jstex".
packages = ["jstex"]
artifacts = ["jstex/static"]

[tool.hatch.build.targets.wheel.shared-data]
"jstex/labextension" = "share/jupyter/labextensions/jupyterlab-jstex"
"install.json" = "share/jupyter/labextensions/jupyterlab-jstex/install.json"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"

[tool.hatch.build.hooks.version]
path = "jstex/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jstex/labextension/static/style.js",
    "jstex/static/widget.js",
    "jstex/labextension/package.json",
]
skip-if-exists = ["jstex/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "jstex/labextension"

[tool.jupyter-releaser.options]
version_cmd = "hatch version"

[tool.jupyter-releaser.hooks]
before-build-npm = [
    "python -m pip install 'jupyter-builder>=1.2.0,<2'",
    "jlpm",
    "jlpm build:prod"
]
before-build-python = ["jlpm clean:all"]

[tool.check-wheel-contents]
ignore = ["W002"]
