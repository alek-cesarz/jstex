name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
      - name: Build wheel
        run: |
          set -eux
          python -m pip install -U "jupyterlab>=4.6,<5" build
          python -m build
      - name: Check the wheel version matches the tag
        run: test -f "dist/jupyterlab_jstex-${GITHUB_REF_NAME#v}-py3-none-any.whl"
      - name: Create GitHub Release with the wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "jupyterlab-jstex $GITHUB_REF_NAME" --notes-file notes.md
